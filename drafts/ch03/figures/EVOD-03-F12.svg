<svg xmlns="http://www.w3.org/2000/svg" width="900" height="745" viewBox="0 0 900 745" role="img" aria-labelledby="title desc"><title id="title">EVOD-03-F12: From a local update to a reproducible training run</title><desc id="desc">A validated tiny update is not an experiment demonstrating generalization. No DOGMA/Hermon training or engine claim.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#18344A">Verified local derivatives are one gate in a training lifecycle</text><rect x="120" y="85" width="660" height="82" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="145" y="116" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">DATA / SPLIT</text><text x="145" y="148" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">fixed information access</text><path d="M450,167 L450,193" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="120" y="197" width="660" height="82" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="145" y="228" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">FORWARD + LOSS</text><text x="145" y="260" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">declared mask / denominator</text><path d="M450,279 L450,305" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="120" y="309" width="660" height="82" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="145" y="340" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">BACKWARD</text><text x="145" y="372" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">derivative contract</text><path d="M450,391 L450,417" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="120" y="421" width="660" height="82" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="145" y="452" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">UPDATE</text><text x="145" y="484" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">parameters + optimizer state</text><path d="M450,503 L450,529" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="120" y="533" width="660" height="82" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="145" y="564" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">CHECKPOINT</text><text x="145" y="596" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">parameters, state, RNG, cursor</text><text x="450" y="707" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">Chapter 4 must test restart equivalence and held-out evaluation; this is a plan.</text></g></svg>
