<svg xmlns="http://www.w3.org/2000/svg" width="900" height="749" viewBox="0 0 900 749" role="img" aria-labelledby="title desc"><title id="title">EVOD-03-F6: Stable softmax cross entropy</title><desc id="desc">Algebraic equality does not imply numerical equality. Stability is not immunity to all nonfinite inputs.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#18344A">Subtract the maximum before exponentiating</text><text x="450" y="77" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">Target class y = 1; finite CPU float64 example</text><text x="30" y="159" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">logits z</text><rect x="295" y="120" width="160" height="65" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="375" y="161" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">1000</text><path d="M375,185 L375,229" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="485" y="120" width="160" height="65" rx="8" fill="#E5F2E9" stroke="#ABC1CF" stroke-width="1.5"/><text x="565" y="161" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">1001</text><path d="M565,185 L565,229" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="675" y="120" width="160" height="65" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="755" y="161" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">999</text><path d="M755,185 L755,229" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="215" font-size="18" font-weight="normal" text-anchor="middle" fill="#18344A">m = 1001</text><text x="30" y="279" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">shifted z − m</text><rect x="295" y="240" width="160" height="65" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="375" y="281" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">-1</text><path d="M375,305 L375,349" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="485" y="240" width="160" height="65" rx="8" fill="#E5F2E9" stroke="#ABC1CF" stroke-width="1.5"/><text x="565" y="281" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">0</text><path d="M565,305 L565,349" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="675" y="240" width="160" height="65" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="755" y="281" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">-2</text><path d="M755,305 L755,349" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="30" y="399" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">exp(z − m)</text><rect x="295" y="360" width="160" height="65" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="375" y="401" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">0.367879</text><rect x="485" y="360" width="160" height="65" rx="8" fill="#E5F2E9" stroke="#ABC1CF" stroke-width="1.5"/><text x="565" y="401" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">1.000000</text><rect x="675" y="360" width="160" height="65" rx="8" fill="#F3F5F7" stroke="#ABC1CF" stroke-width="1.5"/><text x="755" y="401" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">0.135335</text><rect x="20" y="493" width="860" height="140" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="40" y="535" font-size="26" font-weight="bold" text-anchor="start" fill="#18344A">L = log Σ exp(zⱼ − m) − (zᵧ − m)</text><text x="40" y="581" font-size="22" font-weight="normal" text-anchor="start" fill="#18344A">    = log(1 + exp(−1) + exp(−2)) − 0 = 0.4076059644</text><text x="450" y="679" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">Naive exp(z) overflows; these equivalent shifted operations remain finite here.</text><text x="450" y="716" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">Green shading marks the target column; the maximum shift does not change it.</text></g></svg>
