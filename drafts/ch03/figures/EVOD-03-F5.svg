<svg xmlns="http://www.w3.org/2000/svg" width="900" height="727" viewBox="0 0 900 727" role="img" aria-labelledby="title desc"><title id="title">EVOD-03-F5: Broadcast backward is a sum</title><desc id="desc">Forward sharing requires reverse summation, not arbitrary averaging. Loss normalization and broadcast reduction are separate operations.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><defs><marker id="shared-adjoint" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#7147A8"/></marker></defs><text x="450" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#18344A">One shared bias; three reverse contributions</text><text x="450" y="77" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">Projection coordinate j = 1 in the fixed three-row network</text><circle cx="130" cy="253" r="38" fill="#E5EFF8" stroke="#176CA4" stroke-width="2.5"/><text x="130" y="261" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">c₁</text><path d="M171,253 L314,150" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="320" y="115" width="220" height="70" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="430" y="157" font-size="17" font-weight="normal" text-anchor="middle" fill="#18344A">z[0,1] = h[0]·u₁ + c₁</text><path d="M595,150 L547,150" fill="none" stroke="#7147A8" stroke-width="3" marker-end="url(#shared-adjoint)"/><text x="612" y="157" font-size="21" font-weight="normal" text-anchor="start" fill="#7147A8">E[0,1] = +0.099343</text><path d="M171,253 L314,253" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="320" y="218" width="220" height="70" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="430" y="260" font-size="17" font-weight="normal" text-anchor="middle" fill="#18344A">z[1,1] = h[1]·u₁ + c₁</text><path d="M595,253 L547,253" fill="none" stroke="#7147A8" stroke-width="3" marker-end="url(#shared-adjoint)"/><text x="612" y="260" font-size="21" font-weight="normal" text-anchor="start" fill="#7147A8">E[1,1] = +0.098444</text><path d="M171,253 L314,356" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="320" y="321" width="220" height="70" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="430" y="363" font-size="17" font-weight="normal" text-anchor="middle" fill="#18344A">z[2,1] = h[2]·u₁ + c₁</text><path d="M595,356 L547,356" fill="none" stroke="#7147A8" stroke-width="3" marker-end="url(#shared-adjoint)"/><text x="612" y="363" font-size="21" font-weight="normal" text-anchor="start" fill="#7147A8">E[2,1] = -0.226442</text><text x="130" y="422" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">Forward: reuse c₁</text><text x="660" y="422" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">Reverse: contributions already include /3</text><path d="M695,443 L695,487" fill="none" stroke="#7147A8" stroke-width="3" marker-end="url(#shared-adjoint)"/><rect x="20" y="500" width="860" height="143" rx="8" fill="#F3EFF9" stroke="#ABC1CF" stroke-width="1.5"/><text x="40" y="540" font-size="25" font-weight="bold" text-anchor="start" fill="#7147A8">∂L / ∂c₁ = E[0,1] + E[1,1] + E[2,1]</text><text x="40" y="582" font-size="23" font-weight="normal" text-anchor="start" fill="#18344A">Sum, then display rounding: -0.0286559439</text><text x="40" y="620" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">Each use has local derivative 1; the chain rule adds every route to the loss.</text><text x="450" y="694" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">Dividing this sum by 3 again would silently change the gradient scale.</text></g></svg>
