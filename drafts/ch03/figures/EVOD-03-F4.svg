<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-labelledby="title desc"><title id="title">EVOD-03-F4: Correct gradients can still diverge</title><desc id="desc">The gradient is local information; step size determines stability. One stable quadratic is not convergence evidence for a neural architecture.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="25" font-weight="bold" text-anchor="middle" fill="#18344A">L(x) = 2x²: exact gradients, different step sizes</text><text x="450" y="74" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">x_next = (1 − 4η)x; initial x = 1; six declared updates</text><path d="M110,460 L805,460" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M110,460 L110,115" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M110,460.0 L790,460.0" fill="none" stroke="#C6D2DC" stroke-width="1"/><text x="95" y="465.0" font-size="17" font-weight="normal" text-anchor="end" fill="#18344A">10^-3</text><path d="M110,405.0 L790,405.0" fill="none" stroke="#C6D2DC" stroke-width="1"/><text x="95" y="410.0" font-size="17" font-weight="normal" text-anchor="end" fill="#18344A">10^-2</text><path d="M110,350.0 L790,350.0" fill="none" stroke="#C6D2DC" stroke-width="1"/><text x="95" y="355.0" font-size="17" font-weight="normal" text-anchor="end" fill="#18344A">10^-1</text><path d="M110,295.0 L790,295.0" fill="none" stroke="#C6D2DC" stroke-width="1"/><text x="95" y="300.0" font-size="17" font-weight="normal" text-anchor="end" fill="#18344A">10^0</text><path d="M110,240.0 L790,240.0" fill="none" stroke="#C6D2DC" stroke-width="1"/><text x="95" y="245.0" font-size="17" font-weight="normal" text-anchor="end" fill="#18344A">10^1</text><path d="M110,185.0 L790,185.0" fill="none" stroke="#C6D2DC" stroke-width="1"/><text x="95" y="190.0" font-size="17" font-weight="normal" text-anchor="end" fill="#18344A">10^2</text><path d="M110,130.0 L790,130.0" fill="none" stroke="#C6D2DC" stroke-width="1"/><text x="95" y="135.0" font-size="17" font-weight="normal" text-anchor="end" fill="#18344A">10^3</text><text x="110.0" y="488" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">0</text><text x="223.33333" y="488" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">1</text><text x="336.66667" y="488" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">2</text><text x="450.0" y="488" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">3</text><text x="563.33333" y="488" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">4</text><text x="676.66667" y="488" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">5</text><text x="790.0" y="488" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">6</text><path d="M110.0,278.44335 L223.33333,302.84671" fill="none" stroke="#28764A" stroke-width="3"/><path d="M223.33333,302.84671 L336.66667,327.25008" fill="none" stroke="#28764A" stroke-width="3"/><path d="M336.66667,327.25008 L450.0,351.65344" fill="none" stroke="#28764A" stroke-width="3"/><path d="M450.0,351.65344 L563.33333,376.0568" fill="none" stroke="#28764A" stroke-width="3"/><path d="M563.33333,376.0568 L676.66667,400.46016" fill="none" stroke="#28764A" stroke-width="3"/><path d="M676.66667,400.46016 L790.0,424.86352" fill="none" stroke="#28764A" stroke-width="3"/><circle cx="110.00000" cy="278.44335" r="4" fill="#28764A"/><circle cx="223.33333" cy="302.84671" r="4" fill="#28764A"/><circle cx="336.66667" cy="327.25008" r="4" fill="#28764A"/><circle cx="450.00000" cy="351.65344" r="4" fill="#28764A"/><circle cx="563.33333" cy="376.05680" r="4" fill="#28764A"/><circle cx="676.66667" cy="400.46016" r="4" fill="#28764A"/><circle cx="790.00000" cy="424.86352" r="4" fill="#28764A"/><path d="M110.0,278.44335 L223.33333,278.44335" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M223.33333,278.44335 L336.66667,278.44335" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M336.66667,278.44335 L450.0,278.44335" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M450.0,278.44335 L563.33333,278.44335" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M563.33333,278.44335 L676.66667,278.44335" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M676.66667,278.44335 L790.0,278.44335" fill="none" stroke="#176CA4" stroke-width="3"/><circle cx="110.00000" cy="278.44335" r="4" fill="#176CA4"/><circle cx="223.33333" cy="278.44335" r="4" fill="#176CA4"/><circle cx="336.66667" cy="278.44335" r="4" fill="#176CA4"/><circle cx="450.00000" cy="278.44335" r="4" fill="#176CA4"/><circle cx="563.33333" cy="278.44335" r="4" fill="#176CA4"/><circle cx="676.66667" cy="278.44335" r="4" fill="#176CA4"/><circle cx="790.00000" cy="278.44335" r="4" fill="#176CA4"/><path d="M110.0,278.44335 L223.33333,262.36927" fill="none" stroke="#AD3346" stroke-width="3"/><path d="M223.33333,262.36927 L336.66667,246.29518" fill="none" stroke="#AD3346" stroke-width="3"/><path d="M336.66667,246.29518 L450.0,230.2211" fill="none" stroke="#AD3346" stroke-width="3"/><path d="M450.0,230.2211 L563.33333,214.14701" fill="none" stroke="#AD3346" stroke-width="3"/><path d="M563.33333,214.14701 L676.66667,198.07293" fill="none" stroke="#AD3346" stroke-width="3"/><path d="M676.66667,198.07293 L790.0,181.99885" fill="none" stroke="#AD3346" stroke-width="3"/><circle cx="110.00000" cy="278.44335" r="4" fill="#AD3346"/><circle cx="223.33333" cy="262.36927" r="4" fill="#AD3346"/><circle cx="336.66667" cy="246.29518" r="4" fill="#AD3346"/><circle cx="450.00000" cy="230.22110" r="4" fill="#AD3346"/><circle cx="563.33333" cy="214.14701" r="4" fill="#AD3346"/><circle cx="676.66667" cy="198.07293" r="4" fill="#AD3346"/><circle cx="790.00000" cy="181.99885" r="4" fill="#AD3346"/><text x="450" y="515" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">step index (vertical axis: logarithmic loss)</text><text x="130" y="558" font-size="22" font-weight="normal" text-anchor="start" fill="#28764A">η = 0.1: loss decreases</text><text x="130" y="592" font-size="22" font-weight="normal" text-anchor="start" fill="#176CA4">η = 0.5: loss stays constant</text><text x="130" y="626" font-size="22" font-weight="normal" text-anchor="start" fill="#AD3346">η = 0.6: loss increases</text><text x="450" y="690" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">Stability here requires 0 &lt; η &lt; 0.5. This is not a neural-network convergence theorem.</text></g></svg>
