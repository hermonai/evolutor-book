<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">EVOD-03-F3: Three routes to the same derivative</title><desc id="desc">Agreement at smooth finite inputs is evidence with a stated scope. Agreement does not prove the objective or dataset is correct.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="20" y="20" width="860" height="140" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="36" y="55" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">SMOOTH NETWORK: TWO AGREEMENT CHECKS</text><text x="36" y="95" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Hand versus autograd max error: 2.78e-17</text><text x="36" y="124" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Hand versus central difference: 1.47e-11</text><text x="36" y="153" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">PyTorch gradcheck also passes on the fixed float64 fixture.</text><text x="450" y="210" font-size="22" font-weight="bold" text-anchor="middle" fill="#18344A">Known failure: f(x) = x · stop_gradient(x), evaluated at x = 2</text><rect x="20" y="245" width="410" height="160" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="36" y="280" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">FORWARD VALUES</text><text x="36" y="320" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Both factors change when x changes.</text><text x="36" y="349" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">f(2) = 4</text><text x="36" y="378" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Central-difference derivative ≈ 4</text><rect x="470" y="245" width="410" height="160" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="486" y="280" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">AUTOGRAD GRAPH</text><text x="486" y="320" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Second factor is treated as constant.</text><text x="486" y="349" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Recorded derivative = 2</text><text x="486" y="378" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">The diagnostic catches the mismatch.</text><rect x="20" y="460" width="860" height="110" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="36" y="495" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">SCOPE OF THE EVIDENCE</text><text x="36" y="535" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Finite smooth checks validate local derivative behavior.</text><text x="36" y="564" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">They do not validate the dataset, objective or generalization.</text></g></svg>
