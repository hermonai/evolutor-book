<svg xmlns="http://www.w3.org/2000/svg" width="900" height="740" viewBox="0 0 900 740" role="img" aria-labelledby="title desc"><title id="title">EVOD-03-F2: Reverse accumulation is local accounting</title><desc id="desc">Reused values receive the sum of all downstream contributions. A computation DAG is not necessarily the model&#x27;s information-flow guarantee.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><defs><marker id="adjoint-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#7147A8"/></marker></defs><text x="450" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#18344A">Forward values; reverse sensitivities</text><rect x="20" y="80" width="260" height="105" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="35" y="118" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">A = XW + b</text><text x="35" y="155" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">affine input; A[B,H_d]</text><rect x="320" y="80" width="260" height="105" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="335" y="118" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">H = tanh(A)</text><text x="335" y="155" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">hidden values; H[B,H_d]</text><rect x="620" y="80" width="260" height="105" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="635" y="118" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">Z = HU + c</text><text x="635" y="155" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">class logits; Z[B,V]</text><path d="M280,132 L316,132" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M580,132 L616,132" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M750,185 L750,235" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="620" y="235" width="260" height="105" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="636" y="270" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">SCALAR LOSS</text><text x="636" y="310" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">L = mean CE(Z,y)</text><path d="M750,340 L750,390" fill="none" stroke="#7147A8" stroke-width="3" marker-end="url(#adjoint-arrow)"/><rect x="620" y="390" width="260" height="120" rx="8" fill="#F3EFF9" stroke="#BEADD6" stroke-width="1.5"/><text x="632" y="423" font-size="19" font-weight="bold" text-anchor="start" fill="#7147A8">E = ∂L / ∂Z</text><text x="632" y="461" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">(Q − one_hot(y)) / B</text><text x="632" y="487" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">logit sensitivity [B,V]</text><rect x="320" y="390" width="260" height="120" rx="8" fill="#F3EFF9" stroke="#BEADD6" stroke-width="1.5"/><text x="332" y="423" font-size="19" font-weight="bold" text-anchor="start" fill="#7147A8">D_H = EUᵀ</text><text x="332" y="461" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">reverse projection</text><text x="332" y="487" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">hidden sensitivity [B,H_d]</text><rect x="20" y="390" width="260" height="120" rx="8" fill="#F3EFF9" stroke="#BEADD6" stroke-width="1.5"/><text x="32" y="423" font-size="19" font-weight="bold" text-anchor="start" fill="#7147A8">D_A = D_H ⊙ (1−H²)</text><text x="32" y="461" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">local tanh derivative</text><text x="32" y="487" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">input sensitivity [B,H_d]</text><path d="M620,450 L584,450" fill="none" stroke="#7147A8" stroke-width="3" marker-end="url(#adjoint-arrow)"/><path d="M320,450 L284,450" fill="none" stroke="#7147A8" stroke-width="3" marker-end="url(#adjoint-arrow)"/><path d="M150,510 L150,560" fill="none" stroke="#7147A8" stroke-width="3" marker-end="url(#adjoint-arrow)"/><path d="M750,510 L750,560" fill="none" stroke="#7147A8" stroke-width="3" marker-end="url(#adjoint-arrow)"/><rect x="20" y="560" width="395" height="100" rx="8" fill="#F3EFF9" stroke="#BEADD6" stroke-width="1.5"/><text x="35" y="596" font-size="22" font-weight="normal" text-anchor="start" fill="#7147A8">∇W = XᵀD_A</text><text x="35" y="626" font-size="22" font-weight="normal" text-anchor="start" fill="#7147A8">∇b = sum_rows(D_A)</text><rect x="485" y="560" width="395" height="100" rx="8" fill="#F3EFF9" stroke="#BEADD6" stroke-width="1.5"/><text x="500" y="596" font-size="22" font-weight="normal" text-anchor="start" fill="#7147A8">∇U = HᵀE</text><text x="500" y="626" font-size="22" font-weight="normal" text-anchor="start" fill="#7147A8">∇c = sum_rows(E)</text><text x="25" y="245" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Blue → forward evaluation</text><text x="25" y="274" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Purple ← reverse propagation</text><text x="25" y="325" font-size="20" font-weight="normal" text-anchor="start" fill="#5B6874">Backward rules use saved forward values.</text><text x="25" y="353" font-size="20" font-weight="normal" text-anchor="start" fill="#5B6874">Repeated uses add into shared gradients.</text><text x="450" y="710" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">Mean-loss normalization enters once, in E; bias sharing requires row sums.</text></g></svg>
