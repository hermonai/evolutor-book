<svg xmlns="http://www.w3.org/2000/svg" width="900" height="665" viewBox="0 0 900 665" role="img" aria-labelledby="title desc"><title id="title">EVOD-03-F11: A gradient test needs a controlled computation</title><desc id="desc">Numerical checks compare the same function only under controlled conditions. Finite checks are neither general causality proofs nor universal numerical certification.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#18344A">A finite-difference test must evaluate the same function twice</text><text x="450" y="81" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">L(θ;s) = (θ+s)², θ=2, s=3, h=0.001</text><rect x="25" y="126" width="400" height="353" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="45" y="166" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">CONTROLLED</text><text x="45" y="215" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">plus:  θ+h, state 3</text><text x="45" y="244" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">minus: θ−h, state 3</text><path d="M225,276 L225,316" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="225" y="363" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">central difference</text><text x="225" y="415" font-size="29" font-weight="bold" text-anchor="middle" fill="#28764A">10.000</text><rect x="475" y="126" width="400" height="353" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="495" y="166" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">STATE DRIFT</text><text x="495" y="215" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">plus:  θ+h, state 3</text><text x="495" y="244" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">minus: θ−h, state 4</text><path d="M675,276 L675,316" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="675" y="363" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">central difference</text><text x="675" y="415" font-size="29" font-weight="bold" text-anchor="middle" fill="#AD3346">-5489.000</text><text x="450" y="534" font-size="23" font-weight="bold" text-anchor="middle" fill="#18344A">The derivative at fixed state is 2(θ+s) = 10.</text><text x="450" y="580" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">Changing state adds another difference; dividing by tiny h amplifies the confound.</text><text x="450" y="626" font-size="18" font-weight="normal" text-anchor="middle" fill="#18344A">Reset state and replay RNG for both evaluations; parameter perturbation is the only change.</text></g></svg>
