<svg xmlns="http://www.w3.org/2000/svg" width="900" height="721" viewBox="0 0 900 721" role="img" aria-labelledby="title desc"><title id="title">EVOD-03-F8: Roundoff competes with truncation</title><desc id="desc">The useful h range depends on scale and precision. A specific optimum is not portable across dtypes and functions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="25" font-weight="bold" text-anchor="middle" fill="#18344A">A smaller perturbation is not always a better check</text><text x="450" y="77" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">Maximum absolute gradient discrepancy over the fixed float64 network</text><path d="M120,460 L790,460" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M120,460 L120,120" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M120,460.0 L770,460.0" fill="none" stroke="#CCD6DF" stroke-width="1"/><text x="100" y="465.0" font-size="18" font-weight="normal" text-anchor="end" fill="#18344A">10^-12</text><path d="M120,394.0 L770,394.0" fill="none" stroke="#CCD6DF" stroke-width="1"/><text x="100" y="399.0" font-size="18" font-weight="normal" text-anchor="end" fill="#18344A">10^-10</text><path d="M120,328.0 L770,328.0" fill="none" stroke="#CCD6DF" stroke-width="1"/><text x="100" y="333.0" font-size="18" font-weight="normal" text-anchor="end" fill="#18344A">10^-8</text><path d="M120,262.0 L770,262.0" fill="none" stroke="#CCD6DF" stroke-width="1"/><text x="100" y="267.0" font-size="18" font-weight="normal" text-anchor="end" fill="#18344A">10^-6</text><path d="M120,196.0 L770,196.0" fill="none" stroke="#CCD6DF" stroke-width="1"/><text x="100" y="201.0" font-size="18" font-weight="normal" text-anchor="end" fill="#18344A">10^-4</text><text x="120.0" y="490" font-size="18" font-weight="normal" text-anchor="middle" fill="#18344A">10^-9</text><text x="282.5" y="490" font-size="18" font-weight="normal" text-anchor="middle" fill="#18344A">10^-7</text><text x="445.0" y="490" font-size="18" font-weight="normal" text-anchor="middle" fill="#18344A">10^-5</text><text x="607.5" y="490" font-size="18" font-weight="normal" text-anchor="middle" fill="#18344A">10^-3</text><text x="770.0" y="490" font-size="18" font-weight="normal" text-anchor="middle" fill="#18344A">10^-1</text><path d="M120.0,292.62956 L282.5,356.30417" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M282.5,356.30417 L445.0,421.50789" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M445.0,421.50789 L607.5,315.4759" fill="none" stroke="#176CA4" stroke-width="3"/><path d="M607.5,315.4759 L770.0,183.51125" fill="none" stroke="#176CA4" stroke-width="3"/><circle cx="120.0000" cy="292.6296" r="4.5" fill="#176CA4"/><circle cx="282.5000" cy="356.3042" r="4.5" fill="#176CA4"/><circle cx="445.0000" cy="421.5079" r="4.5" fill="#176CA4"/><circle cx="607.5000" cy="315.4759" r="4.5" fill="#176CA4"/><circle cx="770.0000" cy="183.5112" r="4.5" fill="#176CA4"/><text x="450" y="539" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">h increases → (both axes logarithmic)</text><text x="135" y="185" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">Small h:</text><text x="135" y="212" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">roundoff can dominate</text><text x="525" y="405" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">Large h:</text><text x="525" y="432" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">truncation can dominate</text><text x="450" y="594" font-size="22" font-weight="normal" text-anchor="middle" fill="#18344A">Observed low point: h = 10^−5 among these five tested values</text><text x="450" y="644" font-size="25" font-weight="bold" text-anchor="middle" fill="#18344A">Schematic error balance: C₁h² + C₂ε/h</text><text x="450" y="688" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">Connected points guide the eye; no fitted curve or universal optimal h is claimed.</text></g></svg>
