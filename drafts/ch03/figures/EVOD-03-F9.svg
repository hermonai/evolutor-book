<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title desc"><title id="title">EVOD-03-F9: Differentiating a selected computation</title><desc id="desc">Autograd of the executed branch is not a derivative through arbitrary discrete choices. No claim that genomic structural search is solved by ordinary backprop.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#18344A">A biological motivation does not define the derivative</text><text x="30" y="86" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">BIOLOGY: promoter occupancy can inhibit transcription initiation.</text><path d="M70,168 L820,168" fill="none" stroke="#176CA4" stroke-width="5"/><path d="M70,192 L820,192" fill="none" stroke="#28764A" stroke-width="5"/><text x="40" y="172" font-size="17" font-weight="normal" text-anchor="start" fill="#18344A">5′</text><text x="834" y="172" font-size="17" font-weight="normal" text-anchor="start" fill="#18344A">3′</text><text x="40" y="203" font-size="17" font-weight="normal" text-anchor="start" fill="#18344A">3′</text><text x="834" y="203" font-size="17" font-weight="normal" text-anchor="start" fill="#18344A">5′</text><rect x="235" y="157" width="160" height="46" rx="8" fill="#FFF0D5" stroke="#ABC1CF" stroke-width="1.5"/><text x="315" y="189" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">promoter</text><path d="M270,140 C257,109 297,97 315,112 C346,91 375,127 354,150 C363,183 322,187 308,168 C283,189 254,162 270,140 Z" fill="#F8E5AE" stroke="#967229" stroke-width="2"/><text x="315" y="145" font-size="17" font-weight="bold" text-anchor="middle" fill="#18344A">repressor</text><text x="50" y="232" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">Simplified bacterial mechanism; occupancy is not a literal binary computer switch.</text><text x="30" y="300" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">SOFTWARE: choose f(r) = 2 for r ≥ 0, and −1 for r &lt; 0.</text><path d="M135,478 L765,478" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M450,535 L450,344" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M165,520 L449,520" fill="none" stroke="#AD3346" stroke-width="4"/><path d="M451,375 L740,375" fill="none" stroke="#28764A" stroke-width="4"/><circle cx="450" cy="375" r="6" fill="#28764A" stroke="#28764A" stroke-width="2.5"/><text x="450" y="383" font-size="24" font-weight="bold" text-anchor="middle" fill="#28764A"></text><circle cx="450" cy="520" r="6" fill="white" stroke="#AD3346" stroke-width="2.5"/><text x="450" y="528" font-size="24" font-weight="bold" text-anchor="middle" fill="#AD3346"></text><text x="764" y="485" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">r</text><text x="464" y="552" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">0</text><text x="175" y="563" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">Left value −1</text><text x="568" y="358" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">Right value 2</text><text x="450" y="619" font-size="21" font-weight="bold" text-anchor="middle" fill="#18344A">At r = 0: central difference = 3/(2h); no finite classical derivative.</text><text x="450" y="665" font-size="18" font-weight="normal" text-anchor="middle" fill="#18344A">Away from the boundary, selection is locally constant; selected parameters can still learn.</text></g></svg>
