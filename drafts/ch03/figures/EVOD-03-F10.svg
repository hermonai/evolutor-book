<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">EVOD-03-F10: Objective, gradient and update are distinct</title><desc id="desc">An update rule adds semantics beyond differentiation. Do not mix coupled L2 and decoupled decay formulas.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#18344A">Momentum is persistent optimizer state</text><text x="450" y="77" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">L(θ)=θ²/2; learning rate 0.1; momentum 0.9; no decay or dampening.</text><text x="30" y="128" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">STEP 1</text><rect x="25" y="165" width="185" height="92" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="117" y="196" font-size="18" font-weight="bold" text-anchor="middle" fill="#18344A">parameter</text><text x="117" y="234" font-size="25" font-weight="normal" text-anchor="middle" fill="#18344A">1.00</text><path d="M214,211 L245,211" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="250" y="165" width="185" height="92" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="342" y="196" font-size="18" font-weight="bold" text-anchor="middle" fill="#18344A">gradient</text><text x="342" y="234" font-size="25" font-weight="normal" text-anchor="middle" fill="#18344A">1.00</text><path d="M439,211 L470,211" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="475" y="165" width="185" height="92" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="567" y="196" font-size="18" font-weight="bold" text-anchor="middle" fill="#18344A">buffer</text><text x="567" y="234" font-size="25" font-weight="normal" text-anchor="middle" fill="#18344A">1.00</text><path d="M664,211 L695,211" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M482,173 L653,173" fill="none" stroke="#176CA4" stroke-width="3"/><rect x="700" y="165" width="185" height="92" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="792" y="196" font-size="18" font-weight="bold" text-anchor="middle" fill="#18344A">new parameter</text><text x="792" y="234" font-size="25" font-weight="normal" text-anchor="middle" fill="#18344A">0.90</text><text x="30" y="328" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">STEP 2</text><rect x="25" y="365" width="185" height="92" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="117" y="396" font-size="18" font-weight="bold" text-anchor="middle" fill="#18344A">parameter</text><text x="117" y="434" font-size="25" font-weight="normal" text-anchor="middle" fill="#18344A">0.90</text><path d="M214,411 L245,411" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="250" y="365" width="185" height="92" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="342" y="396" font-size="18" font-weight="bold" text-anchor="middle" fill="#18344A">gradient</text><text x="342" y="434" font-size="25" font-weight="normal" text-anchor="middle" fill="#18344A">0.90</text><path d="M439,411 L470,411" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="475" y="365" width="185" height="92" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="567" y="396" font-size="18" font-weight="bold" text-anchor="middle" fill="#18344A">buffer</text><text x="567" y="434" font-size="25" font-weight="normal" text-anchor="middle" fill="#18344A">1.80</text><path d="M664,411 L695,411" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M482,373 L653,373" fill="none" stroke="#176CA4" stroke-width="3"/><rect x="700" y="365" width="185" height="92" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="792" y="396" font-size="18" font-weight="bold" text-anchor="middle" fill="#18344A">new parameter</text><text x="792" y="434" font-size="25" font-weight="normal" text-anchor="middle" fill="#18344A">0.72</text><path d="M568,257 L568,360" fill="none" stroke="#176CA4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="585" y="309" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">retain v</text><text x="450" y="520" font-size="22" font-weight="bold" text-anchor="middle" fill="#18344A">First buffer v₁ = g₁. Then v₂ = 0.9v₁ + g₂ = 1.8.</text><text x="450" y="565" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">Both steps use the same derivative rule; history changes the second update.</text><text x="450" y="610" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">This is the declared PyTorch SGD convention, not an Adam or evolution algorithm.</text></g></svg>
