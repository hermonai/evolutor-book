<svg xmlns="http://www.w3.org/2000/svg" width="900" height="750" viewBox="0 0 900 750" role="img" aria-labelledby="title desc"><title id="title">EVOD-03-F1: Shapes are part of the equation</title><desc id="desc">Every operation has an explicit shape and a reverse counterpart. Equal shapes do not guarantee correct semantics.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="25" font-weight="bold" text-anchor="middle" fill="#18344A">One fixed network, explicit dimensions</text><rect x="25" y="65" width="850" height="120" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="41" y="100" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">A = XW + b</text><text x="41" y="140" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">X[3,2] · W[2,2] + b[2]</text><text x="41" y="169" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">A[3,2]; b is shared across rows</text><path d="M450,185 L450,217" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="220" width="850" height="120" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="41" y="255" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">H = tanh(A)</text><text x="41" y="295" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">elementwise nonlinearity</text><text x="41" y="324" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">H[3,2]; same shape, new values</text><path d="M450,340 L450,372" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="375" width="850" height="120" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="41" y="410" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">Z = HU + c</text><text x="41" y="450" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">H[3,2] · U[2,3] + c[3]</text><text x="41" y="479" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Z[3,3]; three class logits per row</text><path d="M450,495 L450,527" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="530" width="850" height="120" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="41" y="565" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">L = mean cross entropy</text><text x="41" y="605" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">targets y[3] are integer class indices</text><text x="41" y="634" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">L is scalar; normalization divides by 3</text><text x="450" y="720" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">CPU float64 reference. The alphabet/model family is not the learning objective.</text></g></svg>
