<svg xmlns="http://www.w3.org/2000/svg" width="900" height="779" viewBox="0 0 900 779" role="img" aria-labelledby="title desc"><title id="title">EVOD-03-F7: Repeated backward calls accumulate</title><desc id="desc">Batch weighting must match the objective from Chapter 2. Equal averaging of unequal batches changes the loss.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#18344A">The denominator belongs to the objective</text><text x="450" y="77" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">All three scored targets have equal weight in the full-batch mean</text><rect x="20" y="115" width="270" height="135" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="38" y="152" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">MICROBATCH A</text><rect x="50" y="179" width="195" height="45" rx="8" fill="#E5EFF8" stroke="#ABC1CF" stroke-width="1.5"/><text x="147" y="210" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">one scored target</text><rect x="365" y="115" width="515" height="135" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="383" y="152" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">MICROBATCH B</text><rect x="395" y="179" width="195" height="45" rx="8" fill="#E5EFF8" stroke="#ABC1CF" stroke-width="1.5"/><text x="492" y="210" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">one scored target</text><rect x="625" y="179" width="195" height="45" rx="8" fill="#E5EFF8" stroke="#ABC1CF" stroke-width="1.5"/><text x="722" y="210" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">one scored target</text><path d="M155,250 L155,295" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M620,250 L620,295" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="155" y="331" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">mean gradient g_A</text><text x="620" y="331" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">mean gradient g_B</text><path d="M155,350 L330,397" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M620,350 L560,397" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="230" y="410" width="460" height="75" rx="8" fill="#E5F2E9" stroke="#ABC1CF" stroke-width="1.5"/><text x="460" y="457" font-size="26" font-weight="bold" text-anchor="middle" fill="#18344A">g = (1·g_A + 2·g_B) / 3</text><text x="450" y="531" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">Weighted max error: 5.12e-17; equal means: 1.64e-01</text><text x="25" y="587" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">BUFFER LIFECYCLE (sum-loss convention)</text><rect x="15" y="604" width="150" height="60" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="90" y="642" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">clear</text><path d="M170,632 L225,632" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="235" y="604" width="150" height="60" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="310" y="642" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">+ 1·g_A</text><path d="M390,632 L455,632" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="465" y="604" width="150" height="60" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="540" y="642" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">+ 2·g_B</text><path d="M620,632 L695,632" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="705" y="604" width="150" height="60" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="780" y="642" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">divide by 3</text><text x="450" y="708" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">Accumulate at unchanged parameters, normalize once, then take one optimizer step.</text><text x="450" y="745" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">Equivalence here uses independent rows; batch-dependent or stateful layers need care.</text></g></svg>
