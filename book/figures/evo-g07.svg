<text x="672.5" y="236" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#19324a">translation</text>
<rect x="35" y="460" width="285" height="145" rx="12" fill="#f3f6ed" stroke="#adbfce" stroke-width="1.4"/>
<text x="55" y="495" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#19324a">Regulatory protein</text>
<text x="55" y="528" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#19324a">Separate factor; origin</text>
<text x="55" y="551" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#19324a">not shown. Acts at a DNA</text>
<text x="55" y="574" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#19324a">control site.</text>
<path d="M155,460 V362" fill="none" stroke="#23577d" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#bar)"/>
<text x="180" y="395" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#19324a">repression</text>
<text x="180" y="421" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#19324a">control, not sequence copying</text>
<rect x="440" y="460" width="525" height="145" rx="12" fill="#fff9ee" stroke="#adbfce" stroke-width="1.4"/>
<text x="460" y="495" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#19324a">What the diagram does not assert</text>
<text x="460" y="531" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#19324a">No reverse translation. No universal feedback</text>
<text x="460" y="556" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#19324a">loop. No claim that all RNA is translated.</text>
<text x="35" y="654" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#19324a">Solid arrow: sequence transfer   |   dashed T-ended line: inhibitory control</text>
<text x="35" y="697" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#19324a">READING: The repressor is not assumed to be the pictured pathway&#x27;s protein product. The drawing</text>
<text x="35" y="719" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#19324a">asserts neither a universal feedback loop nor a complete regulation mechanism.</text>
<text x="35" y="775" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#19324a">BOUNDARY: An untyped protein-to-DNA arrow can falsely suggest reverse translation. A software</text>
<text x="35" y="797" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#19324a">gate is only a proposed analogy, not a biological model.</text>
</svg>
