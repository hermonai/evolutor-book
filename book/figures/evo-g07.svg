<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img" aria-labelledby="title desc">
<title id="title">EVO-G07: Sequence transfer is not regulatory control</title>
<desc id="desc">Bounded protein-coding pathway and generic repression; Crick 1970 and Cooper 2000. Not a complete central-dogma map. Solid arrow: sequence transfer; dashed T-ended line: inhibitory control; no shared arrow meaning is implied. The repressor is not assumed to be the pictured pathway&#x27;s protein product. The drawing asserts neither a universal feedback loop nor a complete regulation mechanism. An untyped protein-to-DNA arrow can falsely suggest reverse translation. A software gate is only a proposed analogy, not a biological model.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#23577d"/></marker><marker id="bar" markerWidth="10" markerHeight="16" refX="5" refY="8" orient="auto"><path d="M5,1 V15" stroke="#23577d" stroke-width="2"/></marker></defs>
<rect width="1000" height="840" fill="white"/>
<text x="30" y="35" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#23577d">EVO-G07 / BIOLOGICAL RELATIONS</text>
<text x="30" y="78" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="bold" text-anchor="start" fill="#19324a">Sequence transfer is not regulatory control</text>
<text x="30" y="111" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#19324a">A protein can change transcription without reverse translation</text>
<rect x="35" y="160" width="240" height="190" rx="12" fill="#f2f7fb" stroke="#adbfce" stroke-width="1.4"/>
<text x="155" y="195" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#19324a">DNA template</text>
