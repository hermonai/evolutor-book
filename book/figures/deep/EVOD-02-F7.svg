<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">EVOD-02-F7: Equal parameter totals can hide different resources</title><desc id="desc">Which variables did the comparison actually hold fixed? Parameter count is not an effective-capacity theorem.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="22" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Matched quantity</text><text x="287" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Confound controlled</text><text x="572" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Still uncontrolled</text><rect x="10" y="50" width="880" height="58" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">parameters</text><text x="287" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">stored trainable scalars</text><text x="572" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">state, width, data, FLOPs</text><rect x="10" y="113" width="880" height="58" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="142" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">width</text><text x="287" y="142" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">representation dimension</text><text x="572" y="142" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">depth, parameters, history</text><rect x="10" y="176" width="880" height="58" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="205" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">state / cache bytes</text><text x="287" y="205" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">runtime memory budget</text><text x="572" y="205" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">precision, access semantics</text><rect x="10" y="239" width="880" height="58" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="268" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">training tokens</text><text x="287" y="268" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">data exposure</text><text x="572" y="268" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">compute per token</text><rect x="10" y="302" width="880" height="58" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="331" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">training FLOPs</text><text x="287" y="331" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">arithmetic budget</text><text x="572" y="331" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">hardware utilization</text><rect x="10" y="365" width="880" height="58" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="394" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">wall time</text><text x="287" y="394" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">time on specified system</text><text x="572" y="394" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">optimization / kernel maturity</text></g></svg>
