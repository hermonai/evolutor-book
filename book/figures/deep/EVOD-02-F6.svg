<svg xmlns="http://www.w3.org/2000/svg" width="900" height="386" viewBox="0 0 900 386" role="img" aria-labelledby="title desc"><title id="title">EVOD-02-F6: Random targets set an information floor</title><desc id="desc">What does below-floor loss mean? A finite test score can fluctuate; repeated evaluation is not untouched evidence.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="15" y="15" width="870" height="100" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="31" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">Independent uniform next base</text><text x="31" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Expected loss = ln 4 + E[KL(uniform ∥ predicted distribution)]</text><rect x="15" y="145" width="410" height="155" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="31" y="180" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">Valid reference</text><text x="31" y="220" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">ln 4 = 1.386294 nats/base</text><text x="31" y="249" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">PPL = 4</text><text x="31" y="278" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">BPB = 2</text><rect x="465" y="145" width="420" height="155" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="481" y="180" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">Deliberate future leak</text><text x="481" y="220" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">0.001006 nats/base</text><text x="481" y="249" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">accuracy = 1</text><text x="481" y="278" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">invalid information access</text><text x="450" y="365" font-size="19" font-weight="normal" text-anchor="middle" fill="#5B6874">Entropy constrains expected fresh-target loss, not every finite sample or training set.</text></g></svg>
