<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">EVOD-01-F9: Compressed state and addressable history</title><desc id="desc">Show per-request state slot versus growing K/V rows; separately account for weights and workspace. Fixed-size state does not imply perfect recall or constant total memory; attention is not guaranteed exact retrieval.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="10" y="15" width="425" height="365" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">DOGMA candidate</text><text x="26" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">carried state per request</text><rect x="465" y="15" width="425" height="365" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="481" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">Hermon DNA</text><text x="481" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">K/V representations by position</text><rect x="60" y="130" width="315" height="45" rx="8" fill="#EFEAF8" stroke="#7147A8" stroke-width="1.5"/><text x="217" y="161" font-size="21" font-weight="normal" text-anchor="middle" fill="#7147A8">state block 1</text><rect x="60" y="195" width="315" height="45" rx="8" fill="#EFEAF8" stroke="#7147A8" stroke-width="1.5"/><text x="217" y="226" font-size="21" font-weight="normal" text-anchor="middle" fill="#7147A8">state block 2</text><rect x="60" y="260" width="315" height="45" rx="8" fill="#EFEAF8" stroke="#7147A8" stroke-width="1.5"/><text x="217" y="291" font-size="21" font-weight="normal" text-anchor="middle" fill="#7147A8">state block L</text><rect x="505" y="125" width="335" height="36" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="675" y="150" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">position 1: K and V</text><rect x="505" y="173" width="335" height="36" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="675" y="198" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">position 2: K and V</text><rect x="505" y="221" width="335" height="36" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="675" y="246" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">position 3: K and V</text><rect x="505" y="269" width="335" height="36" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="675" y="294" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">position 4: K and V</text><text x="675" y="350" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">append next position</text><rect x="10" y="420" width="880" height="100" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26" y="455" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">BOTH ALSO NEED</text><text x="26" y="495" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">weights + temporary buffers + optional history, external memory and traces</text><text x="450" y="565" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">Compression and addressability are strategies, not a universal ranking.</text></g></svg>
