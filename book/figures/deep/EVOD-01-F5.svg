<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">EVOD-01-F5: A stored description can generate a larger structure</title><desc id="desc">Compare a short program generator to its expanded operator sequence and runtime instance. Compilation/development analogy; the digital example is not a model of an organism.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="10.0" y="15" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26.0" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">1  Description</text><text x="26.0" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">repeat prefix 2 times</text><path d="M290.33333,73.0 L300.33333,73.0" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="303.3333333333333" y="15" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="319.33333" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">2  Development</text><text x="319.33333" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">construct ordered plan</text><path d="M583.66667,73.0 L593.66667,73.0" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="596.6666666666666" y="15" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="612.66667" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">3  Program</text><text x="612.66667" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">prefix → prefix</text><rect x="15" y="190" width="870" height="155" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="31" y="225" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">Execute on [3, −1, 2]</text><text x="31" y="265" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">first prefix: [3, 2, 4]</text><text x="31" y="294" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">second prefix: [3, 5, 9]</text><text x="450" y="390" font-size="22" font-weight="normal" text-anchor="middle" fill="#18344A">Generating a program is already possible in ordinary software.</text></g></svg>
