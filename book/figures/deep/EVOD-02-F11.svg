<svg xmlns="http://www.w3.org/2000/svg" width="900" height="451" viewBox="0 0 900 451" role="img" aria-labelledby="title desc"><title id="title">EVOD-02-F11: Removal and transplant answer different questions</title><desc id="desc">Is the effect due to a mechanism or the whole package? Removing a component also changes optimization, capacity and runtime.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="15" y="25" width="410" height="120" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="31" y="60" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">Removal</text><text x="31" y="100" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Full M versus M without X</text><text x="31" y="129" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Replace lost budget if needed</text><rect x="465" y="25" width="420" height="120" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="481" y="60" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">Transplant</text><text x="481" y="100" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Baseline B versus B plus X</text><text x="481" y="129" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Retune under declared budget</text><path d="M220,155 L220,210" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M675,155 L675,210" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="15" y="225" width="410" height="145" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="31" y="260" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">Local question</text><text x="31" y="300" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Does X matter inside M?</text><text x="31" y="329" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Retrained versus inference-only</text><text x="31" y="358" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">are different interventions</text><rect x="465" y="225" width="420" height="145" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="481" y="260" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">Transfer question</text><text x="481" y="300" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Does the effect travel to B?</text><text x="481" y="329" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Failure may reflect interaction,</text><text x="481" y="358" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">not universal uselessness</text><text x="450" y="430" font-size="19" font-weight="normal" text-anchor="middle" fill="#5B6874">Use paired seeds and uncertainty for differences; neither contrast alone proves mechanism.</text></g></svg>
