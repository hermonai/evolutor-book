<svg xmlns="http://www.w3.org/2000/svg" width="900" height="338" viewBox="0 0 900 338" role="img" aria-labelledby="title desc"><title id="title">EVOD-01-F10: From a computational idea to a defensible system</title><desc id="desc">Separate semantic, reference, parity, experiment, engine and capability gates. No new trained model, inference engine or AGI result is claimed.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="10.0" y="15" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26.0" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">1  Semantics</text><text x="26.0" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">types / transitions</text><path d="M290.33333,73.0 L300.33333,73.0" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="303.3333333333333" y="15" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="319.33333" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">2  Reference</text><text x="319.33333" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">exact runnable model</text><path d="M583.66667,73.0 L593.66667,73.0" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="596.6666666666666" y="15" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="612.66667" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">3  Parity</text><text x="612.66667" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">state / logits / causality</text><rect x="10.0" y="156" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26.0" y="191" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">4  Experiments</text><text x="26.0" y="231" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">baselines / ablations</text><path d="M290.33333,214.0 L300.33333,214.0" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="303.3333333333333" y="156" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="319.33333" y="191" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">5  Engine</text><text x="319.33333" y="231" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">profile before kernels</text><path d="M583.66667,214.0 L593.66667,214.0" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="596.6666666666666" y="156" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="612.66667" y="191" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">6  Capabilities</text><text x="612.66667" y="231" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">test transfer and limits</text><text x="450" y="312" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">A failure sends the proposal back for revision; no gate is proof of AGI.</text></g></svg>
