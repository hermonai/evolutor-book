<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-labelledby="title desc"><title id="title">EVOD-01-F6: Four different objects can change</title><desc id="desc">Show execution state, parameter vector, structure and population on separate labeled axes. Relative timescales are design choices, not literal biological timing.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="10" y="20" width="265" height="90" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26" y="55" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">STATE</text><text x="26" y="95" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">one execution</text><path d="M305,65 L600,65" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="72" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">s changes</text><rect x="10" y="125" width="265" height="90" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26" y="160" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">PARAMETERS</text><text x="26" y="200" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">optimizer updates</text><path d="M305,170 L600,170" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="177" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">θ changes</text><rect x="10" y="230" width="265" height="90" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26" y="265" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">STRUCTURE</text><text x="26" y="305" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">proposal / validation</text><path d="M305,275 L600,275" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="282" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">module graph changes</text><rect x="10" y="335" width="265" height="90" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26" y="370" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">POPULATION</text><text x="26" y="410" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">variation / selection</text><path d="M305,380 L600,380" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="630" y="387" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">descriptions change</text><text x="450" y="465" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">Different update rules; no universal ordering of physical durations.</text></g></svg>
