<svg xmlns="http://www.w3.org/2000/svg" width="900" height="422" viewBox="0 0 900 422" role="img" aria-labelledby="title desc"><title id="title">EVOD-02-F10: A balanced memory task matrix</title><desc id="desc">Which task favors which representation? Synthetic extrapolation is not general intelligence or biological function.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="22" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Task</text><text x="307" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Required memory</text><text x="587" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Shortcut to exclude</text><rect x="10" y="50" width="880" height="67" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">exact delay / copy</text><text x="307" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">recover specified past symbol</text><text x="587" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">fixed position / output leak</text><rect x="10" y="122" width="880" height="67" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="151" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">parity / running sum</text><text x="307" y="151" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">compressed statistic</text><text x="587" y="151" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">class imbalance / length</text><rect x="10" y="194" width="880" height="67" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="223" font-size="19" font-weight="normal" 