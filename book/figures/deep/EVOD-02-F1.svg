<svg xmlns="http://www.w3.org/2000/svg" width="900" height="412" viewBox="0 0 900 412" role="img" aria-labelledby="title desc"><title id="title">EVOD-02-F1: Five objects that must not be conflated</title><desc id="desc">Where does a result get its meaning? No arrow from a score directly to architectural superiority.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="22" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Object</text><text x="197" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Concrete next-base example</text><text x="587" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Not interchangeable with</text><rect x="10" y="50" width="880" height="65" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">Data</text><text x="197" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">sequence records + relationships</text><text x="587" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">task</text><rect x="10" y="120" width="880" height="65" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="149" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">Task</text><text x="197" y="149" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">predict next base from prefix</text><text x="587" y="149" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">architecture</text><rect x="10" y="190" width="880" height="65" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="219" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">Model</text><text x="197" y="219" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">prefix counts or trained fθ</text><text x="587" y="219" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">objective</text><rect x="10" y="260" width="880" height="65" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="289" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">Objective</text><text x="197" y="289" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">mean negative log probability</text><text x="587" y="289" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">success claim</text><rect x="10" y="330" width="880" height="65" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="359" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">Metric + protocol</text><text x="197" y="359" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">held-out nats/base + split + mask</text><text x="587" y="359" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">training loss alone</text></g></svg>
