<svg xmlns="http://www.w3.org/2000/svg" width="900" height="402" viewBox="0 0 900 402" role="img" aria-labelledby="title desc"><title id="title">EVOD-02-F2: One base string, several prediction units</title><desc id="desc">How does tokenization change the question? Overlapping k-mers share most of the next target.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="22" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Encoding of A C G T A C</text><text x="317" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Tokens</text><text x="632" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">What changes</text><rect x="10" y="50" width="880" height="80" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">single bases</text><text x="317" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">A / C / G / T / A / C</text><text x="632" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">6 tokens; 4-symbol alphabet</text><rect x="10" y="135" width="880" height="80" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="164" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">overlapping 3-mers</text><text x="317" y="164" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">ACG / CGT / GTA / TAC</text><text x="632" y="164" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">next token shares 2 bases</text><rect x="10" y="220" width="880" height="80" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="249" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">nonoverlapping 3-mers</text><text x="317" y="249" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">ACG / TAC</text><text x="632" y="249" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">2 tokens; up to 64 types</text><rect x="10" y="305" width="880" height="80" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="334" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">illustrative segmentation</text><text x="317" y="334" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">AC / G / TAC</text><text x="632" y="334" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">variable lengths; learned rules</text></g></svg>
