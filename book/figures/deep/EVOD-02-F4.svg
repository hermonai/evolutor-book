<svg xmlns="http://www.w3.org/2000/svg" width="900" height="431" viewBox="0 0 900 431" role="img" aria-labelledby="title desc"><title id="title">EVOD-02-F4: Teacher forcing without a future shortcut</title><desc id="desc">Which input predicts which target? Testing prefix invariance cannot detect a mis-shifted target alone.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="25" y="32" font-size="24" font-weight="bold" text-anchor="start" fill="#18344A">Input position j predicts the NEXT base, not the current base.</text><text x="35" y="102" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">inputs</text><circle cx="250" cy="90" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="250" y="98" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">A</text><circle cx="400" cy="90" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="400" y="98" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">C</text><circle cx="550" cy="90" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="550" y="98" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">G</text><circle cx="700" cy="90" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="700" y="98" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">T</text><text x="35" y="212" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">targets</text><circle cx="250" cy="200" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="250" y="208" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">C</text><circle cx="400" cy="200" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="400" y="208" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">G</text><circle cx="550" cy="200" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="550" y="208" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">T</text><circle cx="700" cy="200" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="700" y="208" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">A</text><path d="M250,120 L250,165" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M400,120 L400,165" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M550,120 L550,165" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M700,120 L700,165" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="345" font-size="23" font-weight="normal" text-anchor="middle" fill="#18344A">Allowed for output j: inputs 0…j. Forbidden: inputs j+1…T−1.</text><text x="450" y="410" font-size="19" font-weight="normal" text-anchor="middle" fill="#5B6874">A diagonal-inclusive mask is causal only with this shifted target convention.</text></g></svg>
