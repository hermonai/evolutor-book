<svg xmlns="http://www.w3.org/2000/svg" width="900" height="710" viewBox="0 0 900 710" role="img" aria-labelledby="title desc"><title id="title">EVOD-01-F8: Models, engines and orchestration occupy different levels</title><desc id="desc">Editable UML components with dependency stereotypes; DOGMA and Hermon remain separate under Evolutor. Target research architecture, not a deployed platform.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="225" y="15" width="450" height="110" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="241" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">«research» Evolutor</text><text x="241" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">theory / experiments</text><rect x="15" y="185" width="400" height="110" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="31" y="220" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">«model» DOGMA</text><text x="31" y="260" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">non-Transformer DNA-native</text><rect x="485" y="185" width="400" height="110" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="501" y="220" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">«model» Hermon DNA</text><text x="501" y="260" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">Transformer-based DNA</text><rect x="15" y="350" width="400" height="110" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="31" y="385" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">«engine» DOGMA Engine</text><text x="31" y="425" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">state-native execution</text><rect x="485" y="350" width="400" height="110" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="501" y="385" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">«engine» Hermon DNA Engine</text><text x="501" y="425" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">attention / KV execution</text><rect x="225" y="530" width="450" height="110" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="241" y="565" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">«orchestration» Evolutor</text><text x="241" y="605" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">compose engines and modules</text><path d="M370,130 L215,180" fill="none" stroke="#176CA4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M530,130 L685,180" fill="none" stroke="#176CA4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M215,345 L215,300" fill="none" stroke="#176CA4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M685,345 L685,300" fill="none" stroke="#176CA4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="232" y="330" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">implements</text><text x="702" y="330" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">implements</text><path d="M370,525 L215,465" fill="none" stroke="#176CA4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M530,525 L685,465" fill="none" stroke="#176CA4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="190" y="510" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">invokes</text><text x="660" y="510" font-size="18" font-weight="normal" text-anchor="start" fill="#18344A">invokes</text><text x="450" y="685" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">Dashed arrows: clien