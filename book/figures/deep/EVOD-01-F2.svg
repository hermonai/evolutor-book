<svg xmlns="http://www.w3.org/2000/svg" width="900" height="425" viewBox="0 0 900 425" role="img" aria-labelledby="title desc"><title id="title">EVOD-01-F2: A catalog is not an execution</title><desc id="desc">Show immutable module catalog, two selected plans and their outputs on the same signal. This is ordinary conditional software before it is any new architecture.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="10" y="15" width="880" height="110" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">ONE IMMUTABLE CATALOG</text><text x="26" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">clip     center     prefix</text><rect x="10" y="180" width="425" height="165" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26" y="215" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">bounded</text><text x="26" y="255" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">clip → prefix</text><text x="26" y="284" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">[3, −1, 2] → [3, 3, 5]</text><rect x="465" y="180" width="425" height="165" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="481" y="215" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">balanced</text><text x="481" y="255" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">center → prefix</text><text x="481" y="284" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">output: [5/3, −2/3, 0]</text><path d="M225,128 L225,175" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M675,128 L675,175" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="394" font-size="22" font-weight="normal" text-anchor="middle" fill="#18344A">Same catalog and input; context changes the selected plan.</text></g></svg>
