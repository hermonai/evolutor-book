<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">EVOD-01-F3: Control changes activity without rewriting DNA</title><desc id="desc">Show promoter/transcription machinery and a qualitative signal-controlled abundance change. Conceptual biology; no measured rates and no assumption that all regulation is transcriptional.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="33" font-size="25" font-weight="bold" text-anchor="middle" fill="#18344A">A qualitative transcription-control example</text><path d="M90,208 L810,208" fill="none" stroke="#176CA4" stroke-width="5"/><rect x="290" y="170" width="110" height="74" rx="8" fill="#E7F2EA" stroke="#28764A" stroke-width="1.5"/><text x="345" y="216" font-size="23" font-weight="bold" text-anchor="middle" fill="#18344A">site</text><rect x="470" y="170" width="285" height="74" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="610" y="216" font-size="22" font-weight="bold" text-anchor="middle" fill="#18344A">transcribed region</text><circle cx="345" cy="88" r="32" fill="#FFFFFF" stroke="#28764A" stroke-width="2.5"/><text x="345" y="96" font-size="24" font-weight="bold" text-anchor="middle" fill="#28764A">R</text><text x="400" y="95" font-size="23" font-weight="normal" text-anchor="start" fill="#18344A">regulatory molecule</text><path d="M345,122 L345,162" fill="none" stroke="#28764A" stroke-width="3" marker-end="url(#arrow)"/><text x="90" y="250" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">DNA</text><path d="M610,250 L610,299" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="610" y="336" font-size="24" font-weight="bold" text-anchor="middle" fill="#18344A">RNA synthesis</text><text x="450" y="390" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">Binding can change activity; the DNA sequence need not change.</text><text x="450" y="424" font-size="20" font-weight="normal" text-anchor="middle" fill="#5B6874">Other control points exist; no quantitative rates are shown.</text></g></svg>
