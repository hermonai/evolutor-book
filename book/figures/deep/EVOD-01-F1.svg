<svg xmlns="http://www.w3.org/2000/svg" width="900" height="435" viewBox="0 0 900 435" role="img" aria-labelledby="title desc"><title id="title">EVOD-01-F1: Programs, neural models and genomic systems</title><desc id="desc">Three aligned lanes compare persistence, selection and execution, with distinct biology/software symbols. Correspondence is an analogy, not identity or a novelty claim.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="10" y="20" width="280" height="350" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26" y="55" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">PROGRAM</text><text x="26" y="95" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">code / configuration</text><path d="M150,115 L150,140" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="150" y="155" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">calls and branches</text><path d="M150,180 L150,205" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="150" y="220" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">processor + runtime</text><path d="M150,245 L150,270" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="150" y="285" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">output and state</text><rect x="310" y="20" width="280" height="350" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="326" y="55" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">NEURAL MODEL</text><text x="326" y="95" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">structure + weights</text><path d="M450,115 L450,140" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="155" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">activations / routing</text><path d="M450,180 L450,205" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="220" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">tensor operations</text><path d="M450,245 L450,270" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="285" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">prediction and state</text><rect x="610" y="20" width="280" height="350" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="626" y="55" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">GENOMIC SYSTEM</text><text x="626" y="95" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">DNA + cellular context</text><path d="M750,115 L750,140" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="750" y="155" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">regulated expression</text><path d="M750,180 L750,205" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="750" y="220" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">molecular machinery</text><path d="M750,245 L750,270" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="750" y="285" font-size="19" font-weight="normal" text-anchor="middle" fill="#18344A">products / phenotype</text><text x="450" y="409" font-size="22" font-weight="normal" text-anchor="middle" fill="#18344A">Aligned questions do not make the three mechanisms identical.</text></g></svg>
