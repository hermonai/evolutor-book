<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">EVOD-01-F7: Before calling it genomic, check computer science</title><desc id="desc">Matrix of dispatch, MoE, attention, recurrence, search and orchestration against claims they already cover. No existing technique is exhaustively taught or ranked in Chapter 1.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="10" y="15" width="880" height="56" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="28" y="51" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">Dispatch / plugins</text><text x="448" y="51" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">select stored routines</text><rect x="10" y="80" width="880" height="56" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="28" y="116" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">MoE / conditional networks</text><text x="448" y="116" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">route work among experts</text><rect x="10" y="145" width="880" height="56" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="28" y="181" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">Attention / retrieval</text><text x="448" y="181" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">query accessible representations</text><rect x="10" y="210" width="880" height="56" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="28" y="246" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">Recurrence / SSMs</text><text x="448" y="246" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">update carried state</text><rect x="10" y="275" width="880" height="56" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="28" y="311" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">Synthesis / architecture search</text><text x="448" y="311" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">construct or search programs</text><rect x="10" y="340" width="880" height="56" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="28" y="376" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">Agent / workflow systems</text><text x="448" y="376" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">compose tools and actions</text><text x="450" y="442" font-size="21" font-weight="normal" text-anchor="middle" fill="#18344A">A new label must earn a new semantic or empirical contribution.</text></g></svg>
