<svg xmlns="http://www.w3.org/2000/svg" width="900" height="374" viewBox="0 0 900 374" role="img" aria-labelledby="title desc"><title id="title">EVOD-02-F12: Quality and execution are separate axes</title><desc id="desc">Can a model be better and an engine be wrong? Toy timings are not production performance.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="22" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Evidence axis</text><text x="277" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Measure</text><text x="632" y="32" font-size="20" font-weight="bold" text-anchor="start" fill="#18344A">Required context</text><rect x="10" y="50" width="880" height="73" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">predictive quality</text><text x="277" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">NLL, BPB, F1, retrieval accuracy</text><text x="632" y="79" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">same task / targets / split</text><rect x="10" y="128" width="880" height="73" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="157" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">confidence quality</text><text x="277" y="157" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">calibration, proper log score</text><text x="632" y="157" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">population + fitted calibration</text><rect x="10" y="206" width="880" height="73" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="235" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">systems performance</text><text x="277" y="235" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">latency, throughput, memory</text><text x="632" y="235" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">hardware / batch / precision</text><rect x="10" y="284" width="880" height="73" rx="8" fill="#FFFFFF" stroke="#ABC1CF" stroke-width="1.5"/><text x="22" y="313" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">engine fidelity</text><text x="277" y="313" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">reference-output difference</text><text x="632" y="313" font-size="19" font-weight="normal" text-anchor="start" fill="#18344A">same weights / inputs / dtype</text></g></svg>
