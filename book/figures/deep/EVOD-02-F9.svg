<svg xmlns="http://www.w3.org/2000/svg" width="900" height="381" viewBox="0 0 900 381" role="img" aria-labelledby="title desc"><title id="title">EVOD-02-F9: Exact task semantics precede training</title><desc id="desc">What must a delay benchmark really remember? A high score on correlated inputs may not establish delayed memory.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="25" y="100" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">input</text><circle cx="230" cy="95" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="230" y="103" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">A</text><circle cx="345" cy="95" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="345" y="103" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">C</text><circle cx="460" cy="95" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="460" y="103" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">G</text><circle cx="575" cy="95" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="575" y="103" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">T</text><circle cx="690" cy="95" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="690" y="103" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">A</text><circle cx="805" cy="95" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="805" y="103" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">C</text><text x="25" y="245" font-size="22" font-weight="bold" text-anchor="start" fill="#18344A">delay 2</text><circle cx="230" cy="240" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="230" y="248" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">—</text><circle cx="345" cy="240" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="345" y="248" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">—</text><circle cx="460" cy="240" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="460" y="248" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">A</text><circle cx="575" cy="240" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="575" y="248" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">C</text><circle cx="690" cy="240" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="690" y="248" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">G</text><circle cx="805" cy="240" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="805" y="248" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">T</text><path d="M230,128 L460,206" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M345,128 L575,206" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M460,128 L690,206" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M575,128 L805,206" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="360" font-size="19" font-weight="normal" text-anchor="middle" fill="#5B6874">Zero-based scored positions 2…5. First two positions are unscored, not default-A targets.</text></g></svg>
