<svg xmlns="http://www.w3.org/2000/svg" width="900" height="750" viewBox="0 0 900 750" role="img" aria-labelledby="title desc"><title id="title">EVOD-01-F4: Selection, execution and trace are separate objects</title><desc id="desc">Use a UML activity diagram with guarded alternatives and an explicit ordered sequence of operations. A computational expression plan is proposed terminology, not biological gene expression.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><circle cx="450" cy="25" r="10" fill="#18344A" stroke="#18344A" stroke-width="2.5"/><text x="450" y="33" font-size="24" font-weight="bold" text-anchor="middle" fill="#18344A"></text><rect x="315" y="62" width="270" height="105" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="331" y="97" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">Read context</text><text x="331" y="137" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">request argument</text><path d="M450,38 L450,57" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M450,195 L535,240 L450,285 L365,240 z" fill="#FFFFFF" stroke="#176CA4" stroke-width="2"/><text x="450" y="247" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">context?</text><path d="M450,170 L450,191" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="20" y="310" width="380" height="110" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="36" y="345" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">clip → prefix</text><text x="36" y="385" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">selected plan</text><rect x="500" y="310" width="380" height="110" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="516" y="345" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">center → prefix</text><text x="516" y="385" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">selected plan</text><text x="185" y="277" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">[bounded]</text><text x="605" y="277" font-size="20" font-weight="normal" text-anchor="start" fill="#18344A">[balanced]</text><path d="M365,240 L210,305" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M535,240 L690,305" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M450,440 L485,465 L450,490 L415,465 z" fill="white" stroke="#176CA4" stroke-width="2"/><path d="M210,425 L410,462" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M690,425 L490,462" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="285" y="525" width="330" height="100" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="301" y="560" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">Execute / trace</text><text x="301" y="600" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">operations in order</text><path d="M450,493 L450,520" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><path d="M450,630 L450,655" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><circle cx="450" cy="675" r="15" fill="white" stroke="#18344A" stroke-width="2.5"/><text x="450" y="683" font-size="24" font-weight="bold" text-anchor="middle" fill="#18344A"></text><circle cx="450" cy="675" r="8" fill="#18344A" stroke="#18344A" stroke-width="2.5"/><text x="450" y="683" font-size="24" font-weight="bold" text-anchor="middle" fill="#18344A"></text><text x="450" y="725" font-size="20" font-weight="normal" text-anchor="middle" fill="#18344A">UML activity; unknown context raises an error (not shown).</text></g></svg>
