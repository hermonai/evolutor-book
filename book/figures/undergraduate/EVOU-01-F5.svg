<svg xmlns="http://www.w3.org/2000/svg" width="900" height="395" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">EVOU-01-F5: How a proposal earns evidence</title>
<desc id="desc">Biological inspiration starts the investigation; a fair test must decide the claim. No measured advantage, training result, general intelligence or breakthrough asserted.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176CA4"/></marker></defs>
<rect width="900" height="395" fill="white"/>
<g font-family="DejaVu Sans, sans-serif"><rect x="10" y="20" width="205" height="150" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="112" y="57" font-size="22" font-weight="bold" text-anchor="middle" fill="#172F43">OBSERVE</text><text x="112" y="105" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">One biological</text><text x="112" y="134" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">feature</text><path d="M215,140 L236,140" fill="none" stroke="#176CA4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="235" y="20" width="205" height="150" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="337" y="57" font-size="22" font-weight="bold" text-anchor="middle" fill="#172F43">PROPOSE</text><text x="337" y="105" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">One explicit</text><text x="337" y="134" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">software rule</text><path d="M440,140 L461,140" fill="none" stroke="#176CA4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="460" y="20" width="205" height="150" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="562" y="57" font-size="22" font-weight="bold" text-anchor="middle" fill="#172F43">COMPARE</text><text x="562" y="105" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">An ordinary</text><text x="562" y="134" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">alternative</text><path d="M665,140 L686,140" fill="none" stroke="#176CA4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="685" y="20" width="205" height="150" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="787" y="57" font-size="22" font-weight="bold" text-anchor="middle" fill="#172F43">TEST</text><text x="787" y="105" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">A declared</text><text x="787" y="134" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">success check</text><text x="450" y="212" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">Arrows: research steps; no advantage has been measured.</text><path d="M797,175 L797,259" fill="none" stroke="#176CA4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="464" y="270" width="426" height="100" rx="10" fill="#FFF6E7" stroke="#9DB6C7" stroke-width="1.5"/><text x="677" y="310" font-size="22" font-weight="normal" text-anchor="middle" fill="#172F43">Does the claim survive the check?</text><text x="677" y="340" font-size="22" font-weight="normal" text-anchor="middle" fill="#172F43">Retain provisionally or revise.</text><text x="25" y="297" font-size="22" font-weight="normal" text-anchor="start" fill="#172F43">A failed prediction matters.</text><text x="25" y="327" font-size="22" font-weight="normal" text-anchor="start" fill="#172F43">A resemblance is not a result.</text></g></svg>
