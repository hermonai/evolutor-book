<svg xmlns="http://www.w3.org/2000/svg" width="900" height="345" viewBox="0 0 900 345" role="img" aria-labelledby="title desc">
<title id="title">EVOU-01-F4: An analogy is a question, not an identity</title>
<desc id="desc">A proposed computational gene is a software label; it is not DNA and has no inherited biological capabilities. Avoid claiming novelty from ordinary conditional execution or proving efficiency through resemblance.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176CA4"/></marker></defs>
<rect width="900" height="345" fill="white"/>
<g font-family="DejaVu Sans, sans-serif"><rect x="10" y="20" width="385" height="225" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><rect x="505" y="20" width="385" height="225" rx="10" fill="#F4F7EB" stroke="#9DB6C7" stroke-width="1.5"/><text x="202" y="59" font-size="24" font-weight="bold" text-anchor="middle" fill="#172F43">SOFTWARE UNIT</text><text x="35" y="107" font-size="22" font-weight="normal" text-anchor="start" fill="#172F43">Stored instructions</text><text x="35" y="137" font-size="22" font-weight="normal" text-anchor="start" fill="#172F43">Executed by a computer</text><text x="35" y="167" font-size="22" font-weight="normal" text-anchor="start" fill="#172F43">“Computational gene”:</text><text x="35" y="197" font-size="22" font-weight="normal" text-anchor="start" fill="#172F43">a proposed software label</text><text x="697" y="59" font-size="24" font-weight="bold" text-anchor="middle" fill="#172F43">BIOLOGICAL GENE</text><text x="530" y="107" font-size="22" font-weight="normal" text-anchor="start" fill="#172F43">DNA region</text><text x="530" y="137" font-size="22" font-weight="normal" text-anchor="start" fill="#172F43">Used by cellular machinery</text><text x="530" y="167" font-size="22" font-weight="normal" text-anchor="start" fill="#172F43">RNA or protein production</text><text x="530" y="197" font-size="22" font-weight="normal" text-anchor="start" fill="#172F43">Physical molecular processes</text><path d="M398,138 L499,138" fill="none" stroke="#176CA4" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="448.5" y="126.0" font-size="20" font-weight="normal" text-anchor="middle" fill="#172F43">compare</text><text x="450" y="285" font-size="22" font-weight="normal" text-anchor="middle" fill="#172F43">Resemblance: stored possibilities used in a context.</text><text x="450" y="322" font-size="22" font-weight="normal" text-anchor="middle" fill="#172F43">Not identity: names do not transfer biological capabilities.</text></g></svg>
