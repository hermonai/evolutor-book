<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
<title id="title">EVOU-01-F3: Same DNA, different expression</title>
<desc id="desc">Gene expression can differ without changing the DNA sequence; cellular machinery is required. Not measured data, binary gene switches, universal equality of every cell genome, or DNA acting alone.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176CA4"/></marker></defs>
<rect width="900" height="380" fill="white"/>
<g font-family="DejaVu Sans, sans-serif"><rect x="10" y="15" width="435" height="270" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="227" y="53" font-size="24" font-weight="bold" text-anchor="middle" fill="#172F43">Cell context 1</text><path d="M70,107 L380,107" stroke="#176CA4" stroke-width="5" fill="none"/><rect x="69.0" y="87" width="42" height="40" rx="10" fill="#FFFFFF" stroke="#9DB6C7" stroke-width="1.5"/><text x="90.0" y="115" font-size="23" font-weight="bold" text-anchor="middle" fill="#172F43">A</text><rect x="159.0" y="87" width="42" height="40" rx="10" fill="#FFFFFF" stroke="#9DB6C7" stroke-width="1.5"/><text x="180.0" y="115" font-size="23" font-weight="bold" text-anchor="middle" fill="#172F43">C</text><rect x="249.0" y="87" width="42" height="40" rx="10" fill="#FFFFFF" stroke="#9DB6C7" stroke-width="1.5"/><text x="270.0" y="115" font-size="23" font-weight="bold" text-anchor="middle" fill="#172F43">G</text><rect x="339.0" y="87" width="42" height="40" rx="10" fill="#FFFFFF" stroke="#9DB6C7" stroke-width="1.5"/><text x="360.0" y="115" font-size="23" font-weight="bold" text-anchor="middle" fill="#172F43">T</text><text x="227" y="155" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">same displayed gene region</text><path d="M227,171 L227,219" fill="none" stroke="#176CA4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="227" y="249" font-size="21" font-weight="bold" text-anchor="middle" fill="#172F43">Lower production of RNA</text><rect x="465" y="15" width="435" height="270" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="682" y="53" font-size="24" font-weight="bold" text-anchor="middle" fill="#172F43">Cell context 2</text><path d="M525,107 L835,107" stroke="#176CA4" stroke-width="5" fill="none"/><rect x="524.0" y="87" width="42" height="40" rx="10" fill="#FFFFFF" stroke="#9DB6C7" stroke-width="1.5"/><text x="545.0" y="115" font-size="23" font-weight="bold" text-anchor="middle" fill="#172F43">A</text><rect x="614.0" y="87" width="42" height="40" rx="10" fill="#FFFFFF" stroke="#9DB6C7" stroke-width="1.5"/><text x="635.0" y="115" font-size="23" font-weight="bold" text-anchor="middle" fill="#172F43">C</text><rect x="704.0" y="87" width="42" height="40" rx="10" fill="#FFFFFF" stroke="#9DB6C7" stroke-width="1.5"/><text x="725.0" y="115" font-size="23" font-weight="bold" text-anchor="middle" fill="#172F43">G</text><rect x="794.0" y="87" width="42" height="40" rx="10" fill="#FFFFFF" stroke="#9DB6C7" stroke-width="1.5"/><text x="815.0" y="115" font-size="23" font-weight="bold" text-anchor="middle" fill="#172F43">T</text><text x="682" y="155" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">same displayed gene region</text><path d="M682,171 L682,219" fill="none" stroke="#176CA4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="682" y="249" font-size="21" font-weight="bold" text-anchor="middle" fill="#172F43">Higher production of RNA</text><text x="450" y="326" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">Arrows: RNA production using cellular machinery, not DNA movement.</text><text x="450" y="358" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">Conceptual comparison; not measured rates or a complete cell.</text></g></svg>
