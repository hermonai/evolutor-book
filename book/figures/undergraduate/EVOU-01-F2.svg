<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
<title id="title">EVOU-01-F2: The boundary belongs to the rule</title>
<desc id="desc">Below means strictly less than; equality belongs to the other branch. Do not depict an untested physical temperature controller.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176CA4"/></marker></defs>
<rect width="900" height="350" fill="white"/>
<g font-family="DejaVu Sans, sans-serif"><text x="90" y="48" font-size="22" font-weight="bold" text-anchor="start" fill="#172F43">INPUT</text><text x="390" y="48" font-size="22" font-weight="bold" text-anchor="start" fill="#172F43">IS IT BELOW 20?</text><text x="690" y="48" font-size="22" font-weight="bold" text-anchor="start" fill="#172F43">RETURNED WORD</text><rect x="15" y="72" width="870" height="65" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="105" y="114" font-size="27" font-weight="bold" text-anchor="start" fill="#172F43">18</text><text x="390" y="114" font-size="24" font-weight="normal" text-anchor="start" fill="#172F43">yes</text><text x="700" y="114" font-size="24" font-weight="bold" text-anchor="start" fill="#172F43">on</text><rect x="15" y="147" width="870" height="65" rx="10" fill="#FFF6E7" stroke="#9DB6C7" stroke-width="1.5"/><text x="105" y="189" font-size="27" font-weight="bold" text-anchor="start" fill="#172F43">20</text><text x="390" y="189" font-size="24" font-weight="normal" text-anchor="start" fill="#172F43">no: equal</text><text x="700" y="189" font-size="24" font-weight="bold" text-anchor="start" fill="#172F43">off</text><rect x="15" y="222" width="870" height="65" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="105" y="264" font-size="27" font-weight="bold" text-anchor="start" fill="#172F43">22</text><text x="390" y="264" font-size="24" font-weight="normal" text-anchor="start" fill="#172F43">no: above</text><text x="700" y="264" font-size="24" font-weight="bold" text-anchor="start" fill="#172F43">off</text><text x="450" y="329" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">The equality case is part of the specification, not an afterthought.</text></g></svg>
