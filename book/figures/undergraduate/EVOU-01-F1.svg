<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
<title id="title">EVOU-01-F1: A stored rule can choose</title>
<desc id="desc">The rule remains fixed while the input selects an answer. A returned word is not a real heater action or safe control system.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176CA4"/></marker></defs>
<rect width="900" height="340" fill="white"/>
<g font-family="DejaVu Sans, sans-serif"><rect x="10" y="40" width="280" height="205" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="150" y="83" font-size="24" font-weight="bold" text-anchor="middle" fill="#172F43">1  Input</text><text x="150" y="147" font-size="25" font-weight="normal" text-anchor="middle" fill="#172F43">temperature: 18</text><rect x="310" y="40" width="280" height="205" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="450" y="83" font-size="24" font-weight="bold" text-anchor="middle" fill="#172F43">2  Stored rule</text><text x="450" y="147" font-size="25" font-weight="normal" text-anchor="middle" fill="#172F43">below 20?</text><rect x="610" y="40" width="280" height="205" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="750" y="83" font-size="24" font-weight="bold" text-anchor="middle" fill="#172F43">3  Output</text><text x="750" y="147" font-size="25" font-weight="normal" text-anchor="middle" fill="#172F43">return “on”</text><path d="M265,190 L332,190" fill="none" stroke="#176CA4" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M568,190 L635,190" fill="none" stroke="#176CA4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="285" font-size="22" font-weight="normal" text-anchor="middle" fill="#172F43">Solid arrows: data used by the next step.</text><text x="450" y="321" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">Output is a word, not a command sent to a real heater.</text></g></svg>
