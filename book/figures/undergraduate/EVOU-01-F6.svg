<svg xmlns="http://www.w3.org/2000/svg" width="900" height="335" viewBox="0 0 900 335" role="img" aria-labelledby="title desc">
<title id="title">EVOU-01-F6: The route from programs to research</title>
<desc id="desc">Each stage supplies tools needed to ask a sharper research question. Later chapters remain plans; this figure does not certify prerequisites.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176CA4"/></marker></defs>
<rect width="900" height="335" fill="white"/>
<g font-family="DejaVu Sans, sans-serif"><rect x="10" y="20" width="280" height="250" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="150" y="61" font-size="21" font-weight="bold" text-anchor="middle" fill="#172F43">1  PROGRAM</text><text x="150" y="106" font-size="23" font-weight="normal" text-anchor="middle" fill="#172F43">Chapters 2–8</text><text x="150" y="170" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">Choices and learning</text><text x="150" y="199" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">from small examples</text><rect x="310" y="20" width="280" height="250" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="450" y="61" font-size="21" font-weight="bold" text-anchor="middle" fill="#172F43">2  BUILD &amp; COMPARE</text><text x="450" y="106" font-size="23" font-weight="normal" text-anchor="middle" fill="#172F43">Parts III–VI</text><text x="450" y="170" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">Sequences, mechanisms</text><text x="450" y="199" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">and fair comparisons</text><rect x="610" y="20" width="280" height="250" rx="10" fill="#EDF5FA" stroke="#9DB6C7" stroke-width="1.5"/><text x="750" y="61" font-size="21" font-weight="bold" text-anchor="middle" fill="#172F43">3  INVESTIGATE</text><text x="750" y="106" font-size="23" font-weight="normal" text-anchor="middle" fill="#172F43">Parts VII–XIV</text><text x="750" y="170" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">Training, engines</text><text x="750" y="199" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">and measured limits</text><path d="M268,235 L332,235" fill="none" stroke="#176CA4" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M568,235 L632,235" fill="none" stroke="#176CA4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="311" font-size="21" font-weight="normal" text-anchor="middle" fill="#172F43">Arrows: teaching order. These later chapters are still planned.</text></g></svg>
