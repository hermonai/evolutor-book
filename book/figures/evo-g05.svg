<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc">
<title id="title">EVO-G05: Training, inference and serving are separate layers</title>
<desc id="desc">Editorial model; arrows specify relationships, not measured superiority. Parity compares outputs and state. Deployment metrics never replace model-quality evaluation. Failure: Schema mismatch, numerical drift or unsafe structural edits block promotion to serving.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#245579"/></marker></defs>
<rect width="1000" height="920" fill="white"/>
<text x="30" y="36" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#245579" font-weight="bold" text-anchor="start">EVO-G05  /  EDITION 2 RESEARCH MAP</text>
<text x="30" y="77" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#20334a" font-weight="bold" text-anchor="start">Training, inference and serving are separate layers</text>
<text x="30" y="110" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#20334a" font-weight="normal" text-anchor="start">Optimization must preserve reference semantics</text>
<path d="M215,270 V340" fill="none" stroke="#245579" stroke-width="2" marker-end="url(#arrow)"/>
<text x="232" y="306" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="start">instantiate</text>
<path d="M215,455 V525" fill="none" stroke="#245579" stroke-width="2" marker-end="url(#arrow)"/>
<text x="232" y="491" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="start">record</text>
<path d="M400,213 H600" fill="none" stroke="#245579" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="500" y="180" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="middle">define semantics</text>
<path d="M400,398 H600" fill="none" stroke="#245579" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="500" y="365" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="middle">compare semantics</text>
<path d="M400,583 H600" fill="none" stroke="#245579" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="500" y="550" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="middle">load compatible</text>
<text x="500" y="568" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="middle">artifact</text>
<path d="M785,270 V340" fill="none" stroke="#245579" stroke-width="2" marker-end="url(#arrow)"/>
<text x="802" y="306" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="start">profile then</text>
<text x="802" y="324" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="start">optimize</text>
<path d="M785,455 V525" fill="none" stroke="#245579" stroke-width="2" marker-end="url(#arrow)"/>
<text x="802" y="491" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#20334a" font-weight="normal" text-anchor="start">integrate</text>
<rect x="30" y="155" width="370" height="115" rx="9" fill="#eef5fb" stroke="#afc4d5"/>
<text x="45" y="183" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#20334a" font-weight="bold" text-anchor="start">Model specification</text>
<text x="45" y="210" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">Objective, causal graph, state and</text>
<text x="45" y="232" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">interfaces.</text>
<rect x="30" y="340" width="370" height="115" rx="9" fill="#eef5fb" stroke="#afc4d5"/>
<text x="45" y="368" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#20334a" font-weight="bold" text-anchor="start">Training reference</text>
<text x="45" y="395" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">PyTorch forward, loss, gradients and</text>
<text x="45" y="417" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">optimizer.</text>
<rect x="30" y="525" width="370" height="115" rx="9" fill="#eef5fb" stroke="#afc4d5"/>
<text x="45" y="553" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#20334a" font-weight="bold" text-anchor="start">Checkpoint and provenance</text>
<text x="45" y="580" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">Architecture, config, data and</text>
<text x="45" y="602" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">parameter identities.</text>
<rect x="600" y="155" width="370" height="115" rx="9" fill="#f2f7f2" stroke="#afc4d5"/>
<text x="615" y="183" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#20334a" font-weight="bold" text-anchor="start">Inference reference</text>
<text x="615" y="210" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">Full-prefix or incremental outputs</text>
<text x="615" y="232" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">and carried state.</text>
<rect x="600" y="340" width="370" height="115" rx="9" fill="#f2f7f2" stroke="#afc4d5"/>
<text x="615" y="368" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#20334a" font-weight="bold" text-anchor="start">Optimized backend</text>
<text x="615" y="395" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">Profile a workload and test</text>
<text x="615" y="417" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">precision-specific parity.</text>
<rect x="600" y="525" width="370" height="115" rx="9" fill="#f2f7f2" stroke="#afc4d5"/>
<text x="615" y="553" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#20334a" font-weight="bold" text-anchor="start">Serving system</text>
<text x="615" y="580" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">Admission, batching, isolation,</text>
<text x="615" y="602" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#20334a" font-weight="normal" text-anchor="start">monitoring and rollback.</text>
<text x="30" y="744" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#245579" font-weight="bold" text-anchor="start">Solid: data / dependency     Dashed: control / review</text>
<text x="30" y="772" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#20334a" font-weight="normal" text-anchor="start">READING: Parity compares outputs and state. Deployment metrics never replace model-quality</text>
<text x="30" y="795" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#20334a" font-weight="normal" text-anchor="start">evaluation.</text>
<text x="30" y="818" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#20334a" font-weight="normal" text-anchor="start">BOUNDARY: Schema mismatch, numerical drift or unsafe structural edits block promotion to serving.</text>
<text x="30" y="898" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#20334a" font-weight="normal" text-anchor="start">Conceptual map. No measured superiority or physical validation is implied by an arrow.</text>
</svg>
