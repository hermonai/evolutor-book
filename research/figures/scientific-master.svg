nchor="start" fill="#AD3346">extension →</text><text x="450" y="447" font-size="21" font-weight="bold" text-anchor="middle" fill="#18344A">Biology does not supply a gradient rule for a hard software selector.</text><rect x="30" y="482" width="400" height="128" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="50" y="515" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">DOGMA</text><text x="50" y="550" font-size="17" font-weight="normal" text-anchor="start" fill="#18344A">non-Transformer DNA-native</text><text x="50" y="575" font-size="17" font-weight="normal" text-anchor="start" fill="#18344A">architecture → training → reference inference</text><rect x="470" y="482" width="400" height="128" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="490" y="515" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">HERMON DNA</text><text x="490" y="550" font-size="17" font-weight="normal" text-anchor="start" fill="#18344A">Transformer-based genomic</text><text x="490" y="575" font-size="17" font-weight="normal" text-anchor="start" fill="#18344A">architecture → training → reference inference</text><path d="M230,610 L450,642" fill="none" stroke="#176CA4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M670,610 L450,642" fill="none" stroke="#176CA4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="450" y="680" font-size="21" font-weight="bold" text-anchor="middle" fill="#18344A">EVOLUTOR: evidence, comparison and eventual orchestration</text><text x="450" y="723" font-size="18" font-weight="normal" text-anchor="middle" fill="#18344A">Lower branches are research tracks, not validated implementations or novelty claims.</text></g></svg>
