<svg xmlns="http://www.w3.org/2000/svg" width="900" height="755" viewBox="0 0 900 755" role="img" aria-labelledby="title desc"><title id="title">EVO-MASTER: Biological regulation motivates a research question</title><desc id="desc">Promoter occupancy can inhibit initiation; accessible promoter can permit RNAP initiation.
Biological regulation ⇢ conditional execution hypothesis; hard routing needs separate mathematics.
DOGMA (non-Transformer) and Hermon DNA (Transformer) each require training and inference proof.
Both ⇢ Evolutor evidence and prospective orchestration; proposed, not validated engines. Original schematic; not to scale; research branches are proposed.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="38" font-size="25" font-weight="bold" text-anchor="middle" fill="#18344A">Biological regulation motivates a research question</text><text x="450" y="77" font-size="18" font-weight="normal" text-anchor="middle" fill="#18344A">Simplified bacterial transcription control; not a universal gene-regulation circuit.</text><text x="30" y="106" font-size="21" font-weight="bold" text-anchor="start" fill="#18344A">A  Promoter occupied: initiation inhibited</text><path d="M75,176 L820,176" fill="none" stroke="#176CA4" stroke-width="5"/><path d="M75,198 L820,198" fill="none" stroke="#28764A" stroke-width="5"/><path d="M85,178 L85,196" fill="none" stroke="#5B6874" stroke-width="1"/><path d="M110,178 L110,196" fill="none" stroke="#5B6874" stroke-width="1"/><path d="M135,178 L135,196" fill="none" stroke="#5B6874" stroke-width="1"/><path d="M160,178 L160,196" fill="none" stroke="#5B6874" stroke-width="1"/><path d="M185,178 L185,196" fill="none" stroke="#5B6874" stroke-width="1"/><path d="M210,178 L210,196" fill="none" stroke="#5B6874" stroke-width="1"/><path d="M235,178 L235,196" fill="none" stroke="#5B6874" stroke-width="1"/><path d="M260,178 L260,196" fill="none" stroke="#5B6874" stroke-width="1"/><path d="M285,178 L285,196" fill="none" stroke="#5B6874" stroke-width="1"/><path d="M310,178 L310,196" fill="none" stroke="#5B6874" stroke-width="1"/><path d="M335,178 L335,196" fill="none" stroke="#5B6874" stroke-width="1"/><path d="M360,178 L360,196" fill="none" stroke="#5B6874" stroke-width="1"/><path d="M385,178 L385,196" fill="none" stroke="#5B6874" stroke-width="1"/><path d="