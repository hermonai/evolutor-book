[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "minievolutor"
version = "0.1.0"
description = "Small executable GCS semantics for the Evolutor book"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["minievolutor*"]

