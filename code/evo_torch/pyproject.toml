[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-torch"
version = "0.1.0"
description = "PyTorch semantic baselines for Transformer and recurrent DNA models"
requires-python = ">=3.11"
dependencies = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["evo_torch*"]

