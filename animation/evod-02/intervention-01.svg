<svg xmlns="http://www.w3.org/2000/svg" width="900" height="481" viewBox="0 0 900 481" role="img" aria-labelledby="title desc"><title id="title">EVOD-02-F5-K1: Change the future, then compare the past outputs</title><desc id="desc">Clone; alter suffix; compare all prefix logits; repeat split points Static state-changing keyframe, not a rendered animation or measured trajectory.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="450" y="30" font-size="25" font-weight="bold" text-anchor="middle" fill="#18344A">Original input</text><circle cx="105" cy="95" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="105" y="103" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">A</text><circle cx="201" cy="95" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="201" y="103" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">C</text><circle cx="297" cy="95" r="25" fill="#FFFFFF" stroke="#176CA4" stroke-width="2.5"/><text x="297" y="103" font-size="24" font-weight="bold" text-anchor="middle" fill="#176CA4">G</text><circle cx="393" cy="95" r="25" fill="#FFFFFF" stroke="#AD3346" stroke-width="2.5"/><text x="393" y="103" font-size="24" font-weight="bold" text-anchor="middle" fill="#AD3346">T</text><circle cx="489" cy="95" r="25" fill="#FFFFFF" stroke="#AD3346" stroke-width="2.5"/><text x="489" y="103" font-size="24" font-weight="bold" text-anchor="middle" fill="#AD3346">A</text><circle cx="585" cy="95" r="25" fill="#FFFFFF" stroke="#AD3346" stroke-width="2.5"/><text x="585" y="103" font-size="24" font-weight="bold" text-anchor="middle" fill="#AD3346">C</text><circle cx="681" cy="95" r="25" fill="#FFFFFF" stroke="#AD3346" stroke-width="2.5"/><text x="681" y="103" font-size="24" font-weight="bold" text-anchor="middle" fill="#AD3346">G</text><circle cx="777" cy="95" r="25" fill="#FFFFFF" stroke="#AD3346" stroke-width="2.5"/><text x="777" y="103" font-size="24" font-weight="bold" text-anchor="middle" fill="#AD3346">T</text><path d="M344,55 L344,235" fill="none" stroke="#5B6874" stroke-width="3" stroke-dasharray="8 6"/><text x="220" y="270" font-size="22" font-weight="normal" text-anchor="middle" fill="#18344A">fixed prefix</text><text x="600" y="270" font-size="22" font-weight="normal" text-anchor="middle" fill="#18344A">intervened future</text><text x="450" y="460" font-size="19" font-weight="normal" text-anchor="middle" fill="#5B6874">Seven boundaries tested. Passing finite interventions is not a proof for all inputs.</text></g></svg>
