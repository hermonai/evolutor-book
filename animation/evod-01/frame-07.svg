<svg xmlns="http://www.w3.org/2000/svg" width="900" height="638" viewBox="0 0 900 638" role="img" aria-labelledby="title desc"><title id="title">EVOD-01-A1-07: Adapt?</title><desc id="desc">Static conceptual keyframe: future proposal only State panel changes; stage identities and layout stay fixed. Conceptual, not a live simulation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#176CA4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="10.0" y="15" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26.0" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">1  Persistent</text><text x="26.0" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">module catalog</text><path d="M290.33333,73.0 L300.33333,73.0" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="303.3333333333333" y="15" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="319.33333" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">2  Context</text><text x="319.33333" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">request input</text><path d="M583.66667,73.0 L593.66667,73.0" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="596.6666666666666" y="15" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="612.66667" y="50" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">3  Regulate</text><text x="612.66667" y="90" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">choose plan</text><rect x="10.0" y="156" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26.0" y="191" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">4  Express</text><text x="26.0" y="231" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">ordered operations</text><path d="M290.33333,214.0 L300.33333,214.0" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="303.3333333333333" y="156" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="319.33333" y="191" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">5  Execute</text><text x="319.33333" y="231" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">produce output</text><path d="M583.66667,214.0 L593.66667,214.0" fill="none" stroke="#176CA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="596.6666666666666" y="156" width="279.3333333333333" height="116" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="612.66667" y="191" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">6  Trace</text><text x="612.66667" y="231" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">record operations</text><rect x="10.0" y="297" width="279.3333333333333" height="116" rx="8" fill="#FFF0D5" stroke="#ABC1CF" stroke-width="1.5"/><text x="26.0" y="332" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">7  Adapt?</text><text x="26.0" y="372" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">future proposal only</text><rect x="10" y="453" width="880" height="160" rx="8" fill="#EDF5FA" stroke="#ABC1CF" stroke-width="1.5"/><text x="26" y="488" font-size="23" font-weight="bold" text-anchor="start" fill="#18344A">ADAPTATION BOUNDARY</text><text x="26" y="528" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">No G→G′ update is implemented by this example.</text><text x="26" y="557" font-size="21" font-weight="normal" text-anchor="start" fill="#18344A">A structural proposal needs its own update and validation rules.</text></g></svg>
